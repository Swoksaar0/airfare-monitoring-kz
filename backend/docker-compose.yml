services:
  postgres:
    image: postgres:16-alpine
    container_name: kz_flights_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kz_user
      POSTGRES_PASSWORD: kz_password
      POSTGRES_DB: kz_flights
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: